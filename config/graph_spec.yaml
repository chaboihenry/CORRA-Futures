# The model. Three candidate products per layer; one selected, others rejected
# or untested with the reason recorded. Node names only; ids in series_map.yaml.
# status: selected | rejected | untested | unsourced

meta:
  treatment: cra_policy_surprise
  treatment_file: data/processed/cra_policy_surprises_alwaysroll.csv
  primary_sample: {start: 2023-04-12, end: 2026-07-15, n: 27}
  shock_1sd_bp: 4.56
  flags: [fomc_same_day]

  design_rule: >
    Stock terminals failed in both tested cases. The flow version succeeded
    for household mortgage originations (ratio 1.72, beta -0.742) but not
    for NFC credit (null at either scaling). Prefer flows, rates and
    spreads, but the variance screen is necessary rather than sufficient -
    it identifies terminals that cannot work, not terminals that will.
    The arithmetic is in excluded > monthly_credit_stocks.

  layer1_estimates:
    goc_2y:  {beta: 1.386, se: 0.176, r2: 0.613, n: 27, owner: central_governments}
    goc_5y:  {beta: 1.071, se: 0.189, r2: 0.444, n: 27, owner: central_governments}
    goc_10y: {beta: 0.815, se: 0.234, r2: 0.319, n: 27, owner: central_governments}

  chain_progress:
    household_fixed_rate: "3 edges COMPLETE. 1 SD shock -> -1.34pp origination growth at h=5, CI [-2.46, -0.22]"
    nfc_borrowing_cost:   "4 edges. b1 x b2 = 0.784 bp of business rate per bp of surprise. Layer 4 kept, sign flagged - see nfcs layer 4 finding_sign"
    others: "general_banking 3, central_governments 3 and banks 4 edges estimate cleanly; hedge_funds reaches 2 (layer 3 not significant); central_banks and asset_managers both stop at 1 (central_banks layer 2 not significant; asset_managers layer 2 not significant with a broken_link at layer 3, though 3 layers are populated - see that sector's own note)"

  cross_cutting_finding: >
    2026-09-16. Two terminal-layer edges now estimated in this project
    directly contradict their recorded mechanism: central_governments L3
    (tbill_3m -> tbill_outstanding_growth: recorded mechanism says a higher
    bill yield should slow issuance growth, estimate is positive - see that
    edge's finding_sign) and nfcs L4 (nfc_nonmortgage_growth ->
    business_insolvencies_growth: recorded mechanism says less credit growth
    should raise insolvency growth, estimate is positive the other way - see
    that edge's finding_sign).

    households L4 belongs in this pattern only partially, precisely stated:
    of its four screened candidate terminals (see excluded >
    households_layer4), only consumer_bankruptcies_growth (+0.196) is a
    documented, unambiguous sign reversal against the mechanism.
    consumer_proposal_share's significant horizons alternate sign (+1.48 h1,
    -2.25 h8, -1.78 h9, +0.68 h10, -1.40 h11, -2.93 h12) rather than
    cleanly reversing. consumer_insolvencies_growth (-0.296, later withdrawn
    for an unrelated double-differencing bug) and consumer_proposals_growth
    (-0.119) both carry the sign the mechanism predicts - they were rejected
    for sample-to-parameter ratio and a specification error, not for their
    sign. Recorded accurately rather than folded into the other two edges'
    finding: households L4 is a story of candidates failing sample-size and
    methodology screens, with one confirmed sign reversal among them, not a
    uniform sign flip across the layer.

    What the two clean reversals (central_governments L3, nfcs L4) and the
    one households L4 reversal (consumer_bankruptcies_growth) share: in each
    case the terminal is an insolvency count or an issuance/credit volume,
    and the thing said to drive it - credit conditions - is jointly
    determined with it rather than strictly prior to it. Firms, households
    and governments already under stress, or already financing themselves
    on favourable terms, adjust how much they borrow or issue at the same
    time as the outcome the graph treats as downstream (Khwaja and Mian
    2008, QJE, on this identification limit in aggregate lending data - see
    the nfcs L4 finding_sign for the fuller argument). households L3
    (mortgage_funds_advanced_growth, the layer-4 parent shared by all four
    candidates above) is a flow with a cleaner supply story - originations
    are volume banks choose to extend - and every edge ending there or
    above it in this project holds its recorded sign; the reversals cluster
    specifically at the fourth hop, onto a count or a stock the subject's
    own condition feeds back into.

    Recorded as a result of this project's design at the terminal layer, not
    a limitation to chase edge by edge: resolving the direction of the
    credit-conditions <-> distress relationship there would need firm- or
    issuer-level panel data with time fixed effects, which this project's
    aggregate monthly sources do not provide.

# ===========================================================================
# LAYER 1 — one set of candidates, shared by all chains
# ===========================================================================
layer1_candidates:
  selected_by_chain: {goc_2y: [central_gov, nfcs, hedge_funds, banks],
                      goc_5y: [households, general_banking],
                      goc_10y: [central_banks, asset_managers]}
  candidates:
    - {node: goc_2y,  status: selected, owner: central_governments, evidence: "b 1.386 se 0.176 R2 0.613. Peak of the term structure"}
    - {node: goc_5y,  status: selected, owner: central_governments, evidence: "b 1.071 se 0.189 R2 0.444. Canadian mortgage pricing anchor"}
    - {node: goc_10y, status: selected, owner: central_governments, evidence: "b 0.815 se 0.234 R2 0.319. Duration point for marked portfolios"}
    - {node: tbill_3m, status: rejected, evidence: "b 0.501, and alpha -2.02 (p 0.0006) is the only significant intercept. Instrument prices months 4-6; 3M bill covers 0-3. Horizon mismatch"}
    - {node: tbill_6m, status: rejected, evidence: "b 0.674. Same mismatch, milder"}
    - {node: tbill_1y, status: rejected, evidence: "b 0.684 R2 0.506. Closer but still below the 2Y peak"}
  finding: >
    Response is hump-shaped across the curve, peaking at 2Y (1.386) and
    declining to 0.815 at 10Y. A pure expectations model cannot produce
    amplification above 1; consistent with a signalling channel.

# ===========================================================================
# 1a. HOUSEHOLDS — COMPLETE, 3 edges
# ===========================================================================
households:
  label: Household sector
  chain: household_fixed_rate
  confidence: high
  result: "1 SD surprise (4.56bp) -> -1.34pp monthly origination growth at h=5. CI [-2.46, -0.22]. Product -0.294"
  note: >
    CAPPED AT 3 EDGES 2026-09-19: layer 4 removed. See excluded >
    households_layer4 for the withdrawn estimate and the three replacement
    candidates that all failed.
  layers:

    - layer: 1
      selected: goc_5y
      owner: central_governments
      estimate: {beta: 1.071, se: 0.189, r2: 0.444, n: 27}
      estimator: event_study
      controls: []
      mechanism: >
        Canadian mortgages are 5-year fixed with renewal, so the 5Y GoC yield
        is the pricing anchor. A path surprise revises the expected average
        overnight rate; the yield is that expectation plus a term premium.

    - layer: 2
      selected: effective_household_rate
      owner: banks
      sector_link: "central_governments -> banks"
      estimator: distributed_lag
      max_lag: 8
      controls: [us_2y]
      estimate: {beta: 0.576, se: 0.082, r2: 0.440, n: 158}
      candidates:
        - {node: effective_household_rate, status: selected, owner: banks,
           evidence: "b 0.576 se 0.082, peaks lag 2. Built from actual new lending",
           robustness: "0.555 uncontrolled; K=4 0.373, K=6 0.462, K=12 0.579"}
        - {node: mortgage_5y_posted, status: rejected,
           evidence: "No lag significant, signs alternating, R2 below 0.02 throughout, sum ~0.09 (n=177). Administered rate for advertising and the stress test; almost no borrower pays it"}
        - {node: broker_5yr_vrm, status: untested,
           evidence: "BROKER_AVERAGE_5YR_VRM, live to 2026-09. Variable-rate market quote. Robustness candidate"}
      mechanism: >
        Banks fund 5-year fixed mortgages off the 5Y yield and add a spread.
        They pass part of a yield move through and absorb the rest by
        compressing the spread. The posted-vs-effective contrast is itself a
        finding: administered rates did not respond, transaction rates did.

    - layer: 3
      selected: mortgage_funds_advanced_growth
      owner: households
      sector_link: "banks -> households"
      estimator: local_projection
      max_horizon: 12
      month_dummies: true
      aggregate_parent: mean_within_month
      controls: [us_2y]
      estimate: {beta: -0.742, se: 0.146, r2: 0.739, n: 33, peak_horizon: 5}
      candidates:
        - {node: mortgage_funds_advanced_growth, status: selected, owner: households,
           evidence: "b -0.742 at h=5, significant h=3-6. FLOW: outcome SD 19.47pp, enough variation to detect"}
        - {node: resi_mortgage_credit_growth, status: rejected, owner: households,
           evidence: "All horizons insignificant. STOCK: outcome SD 0.079pp against regressor SD 11.3bp. See excluded > monthly_credit_stocks"}
        - {node: household_debt_service_ratio, status: rejected, owner: households,
           evidence: "Economically the ideal terminal - captures the renewal channel - but QUARTERLY, ~13 obs in the primary window"}
      mechanism: >
        A higher effective rate raises the payment on new and renewing
        mortgages, reducing origination volume and shrinking qualifying
        amounts under the stress test. Child is unadjusted, so month dummies.
      caveat: >
        Beta turns positive at h=12 (+0.301, p<0.0001). Either overshoot and
        rebound or an artifact of 26 obs against 14 parameters. Not interpreted.

# ===========================================================================
# 1b. GENERAL BANKING
# ===========================================================================
general_banking:
  label: General banking (retail deposit and lending interface)
  chain: banking_deposit_pricing
  confidence: medium
  layers:

    - layer: 1
      selected: goc_5y
      owner: central_governments
      estimate: {beta: 1.071, se: 0.189, r2: 0.444, n: 27}
      estimator: event_study
      controls: []
      mechanism: Shared with households. 5Y is the term funding tenor.

    - layer: 2
      selected: gic_5y
      owner: banks
      estimator: distributed_lag
      max_lag: 8
      controls: [us_2y]
      candidates:
        - {node: gic_5y, status: untested, owner: banks, evidence: "V80691341 verified, weekly. Ready to run"}
        - {node: gic_1y, status: untested, owner: banks, evidence: "V80691339. Shorter tenor, likely faster pass-through"}
        - {node: bank_funding_spread, status: untested, owner: banks,
           evidence: "Derived gic_1y - tbill_1y. Weekly vs daily index; overlap is Wednesdays only, untested"}
      mechanism: >
        Banks compete for term retail funding against the risk-free
        alternative; GIC rates track the corresponding GoC maturity with a
        spread reflecting funding demand.

    - layer: 3
      selected: lending_deposit_spread
      owner: banks
      estimator: distributed_lag
      controls: [us_2y]
      candidates:
        - {node: lending_deposit_spread, status: untested, owner: banks,
           evidence: "Derived effective_household_rate - gic_1y. SPREAD, so it moves. WARNING Friday vs Wednesday stamps may not intersect"}
        - {node: personal_term_deposits, status: rejected, owner: households,
           evidence: "STOCK. Same failure mode as the two tested credit aggregates. Also unsourced"}
        - {node: gic_tbill_spread, status: untested,
           evidence: "Derived gic_5y - goc_5y. Alternative spread if the lending-deposit indexes do not align"}
      mechanism: >
        Asset yields reprice faster than administered deposit rates, so the
        realized retail margin moves before competition closes the gap.

# ===========================================================================
# 2. CENTRAL GOVERNMENTS
# ===========================================================================
central_governments:
  label: Central governments
  chain: federal_debt_service
  confidence: medium
  note: >
    Re-specified after the auction and outstanding-amount data proved
    unusable. BoC publishes outstanding at security level (25k rows/yr) and
    exposes Valet groups only for 2025-26; 2020-2024 are 60 monthly HTML
    pages. Public debt charges are Fiscal Monitor PDFs. This chain uses only
    nodes already on disk.

    CAPPED AT 3 EDGES 2026-09-19: tbill_coverage removed as layer 3;
    tbill_outstanding_growth re-pointed directly onto tbill_3m. See
    excluded > tbill_coverage.
  layers:

    - layer: 1
      selected: goc_2y
      owner: central_governments
      estimate: {beta: 1.386, se: 0.176, r2: 0.613, n: 27}
      estimator: event_study
      controls: []
      mechanism: >
        The 2Y GoC yield is dominated by the expected policy path over the
        horizon the surprise moves, and is the government's marginal
        short-term borrowing cost.

    - layer: 2
      selected: tbill_3m
      owner: central_governments
      estimator: distributed_lag
      max_lag: 8
      controls: [us_2y]
      controls_rationale: Global-rates fork in weekly variation.
      candidates:
        - {node: tbill_3m, status: selected, owner: central_governments,
           evidence: "ratio 21.30 in candidate_screen.csv. Daily, complete,
                      already verified. Secondary-market equivalent of the
                      auction yield"}
        - {node: tbill_auction_yield, status: untested, owner: central_governments,
           evidence: "StatCan 10-10-0144-01, the purer node - the price the
                      government actually paid. Biweekly, 159 of 348 weeks
                      are '..', 189 usable. Registered; used at layer 3"}
        - {node: goc_2y_5y_slope, status: rejected, owner: central_governments,
           evidence: "Derived goc_5y - goc_2y. A curve node rather than a
                      level; used at layer 4 instead"}
      mechanism: >
        The 3-month bill yield is where the government's shortest debt is
        priced. It tracks the front of the curve directly, so a repricing of
        the policy path reaches the marginal funding cost within days.

    - layer: 3
      selected: tbill_outstanding_growth
      owner: central_governments
      estimator: distributed_lag
      max_lag: 8
      controls: [us_2y]
      diff_y: false
      diff_y_note: the child is already a pct_change.
      controls_rationale: Global-rates fork, as layer 2.
      candidates:
        - {node: tbill_outstanding_growth, status: selected, owner: central_governments, evidence: "Re-pointed 2026-09-19 onto tbill_3m directly after tbill_coverage was removed as layer 3 - see excluded > tbill_coverage. Not a rearrangement in search of significance: this is a direct cost-to-issuance link, recorded and estimated once, whatever the result"}
        - {node: goc_2y_5y_slope, status: rejected, owner: central_governments, evidence: "Derived goc_5y - goc_2y. A curve node rather than a level; used at layer 4 instead. Status restored from candidate_screen.csv"}
        - {node: goc_5y_10y_slope, status: rejected, evidence: "Status restored from candidate_screen.csv"}
        - {node: public_debt_charges, status: unsourced, owner: central_governments, evidence: "Fiscal Monitor, monthly. The realised interest bill and the ideal terminal. PDF only. Status restored from candidate_screen.csv"}
      restored: >
        RESTORED 2026-09-14 from results/tables: selection, estimator and
        candidate statuses (then at layer 4, against tbill_coverage). Finding
        and evidence text for those candidate statuses restored the same day
        from the session record.
      mechanism: >
        Government short-term issuance volume responds to funding cost. A
        higher 3-month T-bill yield raises the cost of bill funding, so the
        outstanding stock of bills grows more slowly as the issuer shifts
        toward longer tenors or reduces net new bill supply. Recorded before
        estimation, 2026-09-19: this is a direct cost-to-issuance link
        replacing the null tbill_coverage intermediate, not a discovery
        fitted to whatever the regression returns.
      finding: >
        On the rejected slope candidates, from the prior (layer-4) spec.
        goc_2y_5y_slope rejected as partly mechanical. The edge splits
        exactly - d(goc_5y)/d(auction) = +0.0395 (p=0.79) and
        d(goc_2y)/d(auction) = +0.1870 (p=0.21), their difference reproducing
        the slope coefficient to 5.8e-16, with the goc_2y leg 82.6% of the two
        by absolute size.

        Neither leg is significant alone; the slope becomes significant only
        because differencing removes the common move, and what survives is
        mostly goc_2y, this chain's layer 1.

        The fallback goc_5y_10y_slope clears the variance screen at 3.68 but
        estimates null at beta -0.0930, se 0.0583, p=0.111. A null edge is
        worse than an honest one, so neither slope was preferred to the
        direct tbill_3m edge either.
      finding_sign: >
        The direct tbill_3m -> tbill_outstanding_growth edge (2026-09-19
        run) estimated +0.348 (p=0.0097 controlled, p=0.0102 uncontrolled) -
        the opposite sign from the mechanism recorded above. Not rearranged
        further, per instruction: reported as the result, not as grounds for
        another specification.

        The most likely explanation is reverse causality. Bill issuance
        volume is set by fiscal financing requirements, not by the yield;
        heavy net new supply of bills is a standard downward pressure on
        their own price, i.e. it pushes their yield UP. That is "more
        issuance -> higher yield" read backwards through the regression,
        not "higher yield -> more issuance" as the recorded mechanism
        claims - and it produces exactly this edge's sign.

        This chain's overall positive effect (central_governments product
        +0.774 controlled / +0.803 uncontrolled, both CIs excluding zero)
        inherits this edge's sign. It cannot be read as monetary
        transmission from the policy surprise through to the bill stock; at
        best it is contrary evidence against the recorded mechanism, and at
        worst it mixes in a fiscal-supply effect running the other way.

# ===========================================================================
# 3. CENTRAL BANKS
# ===========================================================================
central_banks:
  label: Central banks (BoC as an affected balance sheet, not the announcer)
  chain: boc_balance_sheet
  confidence: low
  note: >
    Weakest chain. Every natural terminal is a stock or quarterly. Redesigned
    toward the CORRA-target spread, which is a rate and moves daily.
  layers:

    - layer: 1
      selected: goc_10y
      owner: central_governments
      estimate: {beta: 0.815, se: 0.234, r2: 0.319, n: 27}
      estimator: event_study
      controls: []
      mechanism: The 10Y is the duration point of the QE-era GoC portfolio.

    - layer: 2
      selected: corra_target_spread
      owner: hedge_funds
      estimator: local_projection
      controls: [quarter_end_dummy]
      controls_rationale: >
        RESTORED 2026-09-20: removed 2026-09-16 because control_audit.csv
        flagged it unjustified under the old (wrong) reading of "parent_of
        covers the child only" - that reading treated the backdoor criterion
        as the only reason a control could be admissible. It is not: a
        covariate that causes the child but not the parent is a precision
        covariate, not a confounder. It cannot open a backdoor (no path to
        goc_10y) and cannot bias this estimate; it absorbs residual variance
        in corra_target_spread and tightens the SE. Dropping it is exactly
        what took this edge from p=0.0002 to null - removing a genuine
        variance-absorbing covariate, not correcting a biased one. See
        adjustment_set's docstring in causal_estimates.py for the general
        argument; control_audit.csv now reports this case as 'precision',
        not 'unjustified'.
      candidates:
        - {node: corra_target_spread, status: untested, owner: hedge_funds,
           evidence: "Derived AVG.INTWO - V39079, both verified. SPREAD, daily, moves. Redesign away from the stock terminals below"}
        - {node: boc_goc_holdings, status: rejected, owner: central_banks,
           evidence: "STOCK, weekly. Also confounded by QT runoff, which shrinks holdings independent of valuation"}
        - {node: settlement_balances, status: unsourced, owner: central_banks,
           evidence: "Not a clean Valet series - only chart extracts. Would be a stock anyway"}
      mechanism: >
        A higher policy path raises the deposit rate paid on settlement
        balances relative to fixed coupon income. Pressure on funding
        conditions shows in CORRA relative to target.

    - layer: 3
      selected: null
      estimator: local_projection
      candidates:
        - {node: boc_net_income, status: rejected, owner: central_banks,
           evidence: "QUARTERLY, ~13 obs. Same wall as the household debt-service ratio"}
        - {node: interest_margin_on_reserves, status: unsourced, owner: central_banks,
           evidence: "Derived, needs settlement balances which have no clean series"}
        - {node: repo_operation_volume, status: untested, owner: central_banks,
           evidence: "BoC overnight repo operations. FLOW, daily, reactive to CORRA drift - but reverse causality is a live concern"}
      mechanism: TBD - no defensible layer 3 identified yet.

# ===========================================================================
# 4. NFCs — 4 edges estimated. Layer 4 is KEPT with its sign flagged: see the
# layer-4 finding below. The chain product below layer 2 cannot be read as
# monetary transmission - reported as a result, not smoothed over.
# ===========================================================================
nfcs:
  label: Non-financial corporations
  chain: nfc_borrowing_cost
  confidence: high
  result: >
    4 edges. b1 1.386 x b2 0.566 = 0.784, i.e. 1 SD surprise -> 3.6bp of
    business lending rate. Layer 4 (nfc_nonmortgage_growth ->
    business_insolvencies_growth) is KEPT but its sign contradicts this
    chain's mechanism - see the layer-4 finding. The full 4-edge product
    inherits that sign and is not reported as a transmission effect.
  layers:

    - layer: 1
      selected: goc_2y
      owner: central_governments
      estimate: {beta: 1.386, se: 0.176, r2: 0.613, n: 27}
      estimator: event_study
      controls: []
      mechanism: Corporate floating and short-term fixed borrowing is priced off the front of the curve.

    - layer: 2
      selected: effective_business_rate
      owner: banks
      sector_link: "central_governments -> banks"
      estimator: distributed_lag
      max_lag: 8
      controls: [us_2y]
      estimate: {beta: 0.596, se: 0.065, r2: 0.497, n: 159}
      candidates:
        - {node: effective_business_rate, status: selected, owner: banks,
           evidence: "b 0.596 se 0.065. Front-loaded: 0.267 at lag 0, decayed by lag 3. Business lending reprices faster than mortgages, which peak at lag 2"}
        - {node: bankers_acceptance_rate, status: untested,
           evidence: "Discontinued with CDOR in June 2024. Would only cover part of the sample"}
        - {node: corporate_bond_spread, status: untested,
           evidence: "Would separate the credit-risk channel from the risk-free channel. No free Canadian series located"}
      mechanism: >
        The effective business rate blends actual new-lending rates; it
        follows the risk-free curve plus a credit spread with a lag.

    - layer: 3
      selected: nfc_nonmortgage_growth
      owner: nfcs
      sector_link: "banks -> nfcs"
      estimator: local_projection
      max_horizon: 12
      month_dummies: false
      aggregate_parent: mean_within_month
      controls: [us_2y]
      candidates:
        - {node: nfc_nonmortgage_growth, status: selected, owner: nfcs,
           evidence: "Percent change of non-mortgage loans to private NFCs (36-10-0640 rows 12 + 14), in pp, so it composes with the rate parent. Loans only, not total credit liabilities: three fifths of the total is bonds and paper that do not reprice off the bank lending rate. WARNING in-sample growth SD is 0.562pp against a regressor SD of ~12bp - the same smoothness that killed nfc_credit_growth, so it is expected to fail the variance screen"}
        - {node: nfc_credit_flow, status: rejected, owner: nfcs,
           evidence: "The FLOW version of the rejected nfc_credit_growth: the m/m dollar change in the stock rather than its percent change. Same source series, SA, so no month dummies. A $2.4tn stock grows 0.4-0.6% a month with almost no variance in percent terms; the dollar change should carry far more. DISPLACED: it does carry the variance and estimated at -175.3, but millions is a quantity against a rate parent, so the chain product was a unit mismatch rather than an effect - it read -144.7 before the units guard rejected it"}
        - {node: nfc_credit_growth, status: rejected, owner: nfcs,
           evidence: "TESTED, null. No horizon significant, coefficients scattered +/-0.013. STOCK: outcome SD 0.45pp against regressor SD 12.06bp. Household originations by contrast have SD 19.47pp - 40x more variation"}
        - {node: corporate_bond_issuance, status: untested, owner: nfcs,
           evidence: "FLOW. Would need a source; not in Valet"}
      mechanism: >
        Costlier credit reduces net new borrowing for working capital and
        investment; the monthly change in outstanding NFC credit is that net
        flow. Source is seasonally adjusted, so no month dummies.

    - layer: 4
      selected: business_insolvencies_growth
      status: kept_sign_flagged
      owner: nfcs
      estimator: local_projection
      max_horizon: 12
      month_dummies: true
      aggregate_parent: mean_within_month
      controls: [gdp_growth, us_2y]
      diff_x: false
      diff_x_note: >
        The parent is already a pct_change, so it is not differenced again.
        With diff_x true it entered as a change in a growth rate, while the
        layer above produced a level of that growth rate - the chain then
        multiplied a level by a per-change coefficient.
      candidates:
        - {node: business_insolvencies_growth, status: selected, owner: nfcs,
           evidence: "OSB monthly count, m/m growth SD ~16.9pp over 2020-2026. COUNT, not a stock - passes the variance screen. REINSTATED 2026-09-16 as a selected edge, sign flagged: see finding_sign below"}
        - {node: business_insolvencies, status: unsourced, owner: nfcs,
           evidence: "OSB monthly insolvency statistics. COUNT/FLOW - volatile enough to detect. Best remaining candidate"}
      mechanism: >
        Firms unable to roll or extend credit exhaust liquidity and file;
        filings respond to the contraction in net new lending with a lag of
        months. Child is unadjusted, so month dummies.
      controls_rationale: >
        Repointed 2026-09-16 from gdp_monthly (stock) to gdp_growth (its
        pct_change). us_2y added 2026-09-20, matching this project's
        standard global-rates control elsewhere; it is a precision covariate
        here (parent_of covers nfc_nonmortgage_growth, the parent, not
        business_insolvencies_growth, the child - it cannot open a backdoor
        either way, but does not claim to block one either).

        UNBLOCKED 2026-09-20: gdp_monthly registered against
        statcan_3610043401_gdp.csv, so gdp_growth now fetches.

        gdp_growth's role here is judged, not resolved. The backdoor
        argument (demand causes both credit growth and insolvencies) says
        include it. But a rate surprise causes GDP on roughly the horizon
        this edge measures, so on a 6-12 month view gdp_growth may sit ON
        the rate -> activity -> insolvency path rather than beside it - a
        mediator, whose inclusion would block part of the very effect being
        estimated rather than protect it from a confound. Controlled
        (+gdp_growth, +us_2y) vs uncontrolled: beta and significance
        recorded below. CORRECTED 2026-09-16: the earlier version of this
        note claimed the SIZE of the controlled-vs-uncontrolled gap could
        settle which reading is right. It cannot - see finding below. The
        gdp_growth question stays open on a priori grounds only.
      finding: >
        2026-09-20, first estimate now that gdp_growth is unblocked.
        Controlled (gdp_growth, us_2y): beta +7.826, se 2.321, p 0.00074,
        n=33, peak h=1. Uncontrolled: beta +7.011, se 2.099, p 0.00084, n=34,
        peak h=1. Both strongly significant, same sign, same peak horizon.

        CORRECTED 2026-09-16: this finding previously read the controlled
        estimate being LARGER than the uncontrolled one (112% of it) as
        evidence for confounding over mediation, on the claim that "a
        mediator cannot push the estimate further from zero when
        conditioned on." That claim is false whenever the indirect path
        carries the OPPOSITE sign to the direct path. gdp_growth sitting on
        credit_growth -> GDP_growth -> fewer insolvencies is a negative
        indirect path; blocking a negative path by conditioning on its
        mediator REMOVES a negative contribution from the total, which
        raises - not lowers - the remaining direct coefficient. Suppression
        of this kind predicts the observed move from +7.011 to +7.826 just
        as well as an open backdoor does. The controlled-vs-uncontrolled gap
        is therefore not diagnostic between the confounder and mediator
        readings here, and is not used to settle it; see finding_sign below
        for what is reported instead.
      finding_sign: >
        2026-09-16. The recorded mechanism for this chain is that a hawkish
        surprise tightens credit and so raises distress (mechanism above:
        "firms unable to roll or extend credit exhaust liquidity and
        file"). That requires nfc_nonmortgage_growth (layer 3, credit
        growth) and business_insolvencies_growth (layer 4) to move in
        OPPOSITE directions: less credit growth, more insolvency growth.
        This edge estimates the opposite sign in both passes (+7.826
        controlled, +7.011 uncontrolled): MORE non-mortgage credit growth
        predicts MORE business insolvency growth one month later. Composed
        with layers 1-3, whose signs are unchanged, the full nfc_borrowing_cost
        product therefore implies a hawkish surprise REDUCES business
        insolvencies - the opposite of what the chain's own mechanism says
        should happen. KEPT rather than dropped, with the sign flagged
        rather than smoothed over.

        Most likely explanation: reverse causality. nfc_nonmortgage_growth
        is an equilibrium quantity - the outcome of both credit supply and
        credit demand - not a pure supply shock. Distressed firms cut back
        on borrowing (working capital lines go unused, expansion plans are
        shelved) rather than borrowing more as they head toward failure, so
        rising insolvency growth predicts FALLING credit growth read
        forward, which is the same correlation as this edge read backward:
        more credit growth alongside less insolvency growth, one month
        apart. This is the Khwaja and Mian (2008, QJE) credit supply/demand
        identification problem: separating a supply effect from a demand
        effect in aggregate lending data requires firm-time fixed effects
        estimated off matched bank-firm loan-level data (a firm borrowing
        from multiple banks, with fixed effects absorbing its demand), which
        this project's monthly, economy-wide aggregates cannot supply and
        are not designed to. The identification limit is not fixable by
        re-specifying this edge; it is a property of the data available.

        A credit-boom-gone-bust reading - easy credit fuels overextension
        that later fails - would also predict this sign, but not at this
        edge's one-month peak horizon. Leverage build-up culminating in
        failure is a story that plays out over years, not the single month
        this local projection peaks at, so that reading does not fit the
        estimated timing even though it fits the sign.

        Net: this chain's product below layer 2 cannot be read as monetary
        transmission from the policy surprise through to business
        insolvencies. It is reported as a result - one of two clean
        terminal-layer sign reversals in this project against a recorded
        mechanism, alongside central_governments L3, with a third partial
        instance in households L4's rejected candidates; see
        meta.cross_cutting_finding for the full picture - not papered over by
        dropping the edge or re-specifying until the sign matches the story.

