hedge_funds:
  label: Hedge funds and speculators
  chain: speculative_positioning
  confidence: low
  data_warning: >
    No public positioning data exists for MX contracts - there is no COT
    equivalent. Every node is a proxy. Results reported as suggestive.
  note: All three terminals are flows or spreads. No stock problem here.
  layers:

    - layer: 1
      selected: goc_2y
      owner: central_governments
      estimate: {beta: 1.386, se: 0.176, r2: 0.613, n: 27}
      estimator: event_study
      controls: []
      mechanism: The 2Y is where levered rate traders express path views.

    - layer: 2
      selected: cra_oi_growth
      owner: hedge_funds
      estimator: local_projection
      controls: [cra_roll_dummy]
      controls_rationale: >
        cra_roll_dummy blocks the quarterly roll-mechanics fork: open interest
        resets mechanically as positions migrate from the expiring contract to
        the new one, independent of any policy surprise. A surprise that
        happens to land inside the roll window would otherwise have that
        mechanical reset folded into the estimated response.
      candidates:
        - {node: cra_oi_growth, status: selected, owner: hedge_funds,
           evidence: "Percent change of cra_open_interest_level. Same positioning signal as cra_open_interest_chg but in pp, so it composes with a rate parent. In sample SD 2.20pp, max move 16.6pp, no zero denominators"}
        - {node: cra_open_interest_chg, status: rejected, owner: hedge_funds,
           evidence: "Internal, from cleaned_mx_data. FLOW. Needs the internal branch in nodes.py. OI is lagged one day per MX. DISPLACED: the within-contract difference is in contracts, a quantity against a rate parent, so the chain product was a unit mismatch rather than an effect - it read +322.2 before the units guard rejected it"}
        - {node: cra_volume, status: untested, owner: hedge_funds,
           evidence: "Also internal. Turnover rather than net positioning. Its growth version is now the layer-3 selection"}
        - {node: cgz_open_interest_chg, status: untested, owner: hedge_funds,
           evidence: "2Y bond futures OI, already downloaded. Cross-check on the same positioning story. Would need the same level-then-growth treatment to compose"}
      mechanism: >
        Surprises force repositioning; stopped-out shorts and new directional
        bets change aggregate open interest over the following days.
      weakness: OI aggregates hedgers and speculators. Stated, not controlled.

    - layer: 3
      selected: cra_volume_growth
      owner: hedge_funds
      estimator: local_projection
      controls: [quarter_end_dummy]
      diff_controls: false
      diff_x: false
      diff_x_note: >
        The parent is already a pct_change, so it is not differenced again.
        With diff_x true it entered as a change in a growth rate, while the
        layer above produced a level of that growth rate - the chain then
        multiplied a level by a per-change coefficient.
      candidates:
        - {node: cra_volume_growth, status: selected, owner: hedge_funds,
           evidence: "Percent change of cra_volume. Turnover growth in pp, composes with the layer-2 growth parent. In sample SD 63.15pp, max 415.8pp, no zero denominators; unusable before 2023, where 262 of 1546 days have zero volume"}
        - {node: corra_target_spread, status: untested, owner: hedge_funds,
           evidence: "Derived AVG.INTWO - V39079, both verified, daily. SPREAD. The observable footprint of levered activity per BoC SAN 2024-4. Returned no significant horizon against the old contracts parent; still a live alternative, because percent is rate-kind and now composes with the pp parent at layer 2"}
        - {node: repo_volume, status: unsourced, owner: hedge_funds,
           evidence: "BoC publishes it with CORRA. FLOW, daily"}
        - {node: cgb_cash_futures_basis, status: untested,
           evidence: "Derived from CGZ settlement and the 2Y yield. The classic levered trade"}
      mechanism: >
        Funding demand pressing on dealer capacity pushes CORRA above target.
      controls_rationale: >
        quarter_end_dummy blocks the balance-sheet-window fork: dealer
        capacity shrinks at quarter-end.

