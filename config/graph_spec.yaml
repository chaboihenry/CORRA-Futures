# ===========================================================================
# EXOGENOUS NODES — controls promoted to first-class nodes. The per-edge
# controls: lists remain the adjustment set; this block records why each
# control is admissible, so the adjustment set is derivable from the graph
# rather than asserted edge by edge.
# ===========================================================================
exogenous_nodes:
  us_2y:
    owner: global
    role: control
    parent_of: [effective_household_rate, mortgage_funds_advanced_growth, gic_5y, gic_1y, lending_deposit_spread, effective_business_rate, bank_funding_spread, nfc_nonmortgage_growth, goc_5y, goc_2y, goc_10y, tbill_3m, tbill_outstanding_growth, bond_etf_volume_growth]
    backdoor_blocked: "X <- global_rates -> Y"
    rationale: >
      Proxies a common cause of Canadian and US term rates. Rey (2013),
      Dilemma not Trilemma, Jackson Hole: a global financial cycle produces
      large common movements in asset prices, gross flows and leverage across
      countries. Miranda-Agrippino and Rey (2020), Review of Economic Studies
      87(6), quantifies US monetary policy spillovers.

      Second arm: global conditions reach bank lending rates independently of
      the domestic curve. Bruno and Shin (2015) on global banking and the
      risk-taking channel.
    layer1_exclusion: >
      NOT used on layer 1, and the reason is specific to that window. Inside
      the announcement window the spillover runs Canada to US: the surprise
      moves GoC yields and US yields follow within hours, which makes us_2y a
      treatment descendant there, so conditioning would block part of the
      causal path.

      At weekly and monthly frequency that spillover is second-order to the
      global fork, and us_2y is a sibling of the GoC yields under a common
      parent, not a descendant of them.
    parent_of_review: >
      goc_2y, goc_5y, tbill_3m and tbill_outstanding_growth were derived from
      control_audit.csv: each is an end of an edge that declares us_2y.

      goc_10y is added on THEORY, not derivation. The audit cannot derive it,
      because goc_10y is not an end of any edge declaring us_2y. But Rey's
      claim is about the term structure generally, and excluding one maturity
      would be arbitrary.

      2026-09-19: tbill_coverage removed (its edge is gone, see excluded >
      tbill_coverage) and consumer_insolvencies_growth removed (its edge is
      gone, see excluded > households_layer4 - unemployment_rate_ca's
      exogenous_nodes entry, which existed only for that edge, is removed
      entirely for the same reason). bond_etf_volume_growth added on the same
      THEORY basis as goc_10y: it is now a direct child of a bare GoC yield
      (goc_10y), the same edge shape every us_2y-controlled layer-2 edge in
      this file shares, but the edge itself is new so there is no prior
      control_audit.csv row to derive it from.
  gdp_monthly:
    owner: global
    role: control
    parent_of: [nfc_nonmortgage_growth]
    backdoor_blocked: "insolvencies <- demand -> credit_growth"
    rationale: >
      Blocks the demand fork. UNVERIFIED whether it is a mediator: if the
      causal claim runs rate -> activity -> insolvency, conditioning absorbs
      the effect being measured. Bernanke, Gertler and Gilchrist (1999), the
      financial accelerator.
    conflict: >
      The backdoor test says include it: demand causes both credit growth and
      insolvencies. The rationale says it may be a mediator on a rate ->
      activity -> insolvency path, which says exclude it. The derivation
      cannot settle this, because gdp_monthly is in no chain, so no walk of
      edge_pairs can see whether it sits downstream of the rate. Moot while
      the node is status lookup.
    note: >
      business_insolvencies_growth removed from parent_of 2026-09-16: nfcs L4
      now controls on gdp_growth instead, see that entry below. NOT fixed
      here, flagged only: nfc_nonmortgage_growth's own controls: list (nfcs
      L3) does not actually declare gdp_monthly, so this parent_of entry was
      already wider than the edges that use it before this task touched it.
  gdp_growth:
    owner: global
    role: control
    parent_of: [nfc_nonmortgage_growth, business_insolvencies_growth]
    backdoor_blocked: "insolvencies <- demand -> credit_growth"
    rationale: >
      pct_change of gdp_monthly; same demand-fork argument as that node
      (Bernanke, Gertler and Gilchrist 1999, the financial accelerator),
      carried over from the gdp_monthly entry this replaces at nfcs L4.
    conflict: >
      Same mediator concern as gdp_monthly: if rate -> activity -> insolvency
      is the true path, conditioning absorbs part of the effect. Also
      inherits gdp_monthly's status: gdp_monthly has no source file on disk
      (see its series_map note), so gdp_growth is status lookup too and this
      is moot in practice until that file is sourced.
    correction: >
      2026-09-19: nfc_nonmortgage_growth added to parent_of, corrected from
      the 2026-09-16 edit that created this entry - gdp_monthly's parent_of
      covered BOTH nfc_nonmortgage_growth (nfcs L3, this edge's parent) and
      business_insolvencies_growth (the child) before that edit, but only
      the child was carried over to gdp_growth, leaving nfcs L4 flagged
      unjustified in control_audit.csv (a real self-inflicted regression,
      not a deliberate judgment call - fixed here, verified against
      control_audit output).
  vix:
    owner: global
    role: control
    parent_of: [bond_etf_volume_growth, zag_xic_return_spread]
    backdoor_blocked: "flows <- illiquidity -> return_spread"
    rationale: >
      Goldstein, Jiang and Ng (2017), Journal of Financial Economics 126(3) -
      outflow sensitivity to poor performance rises with market illiquidity,
      making illiquidity a common cause of both bond ETF flow/turnover and
      the bond-equity return spread. Added 2026-09-16 at asset_managers L3
      and L4.
  sp500_return_pct:
    owner: global
    role: control
    parent_of: [bank_equity_return]
    backdoor_blocked: "bank_equity <- market -> rate_expectations"
    rationale: >
      Replaces tsx_return 2026-09-16: the TSX Composite holds Canadian banks
      at roughly 20% weight, making it partly a descendant of
      bank_equity_return rather than a clean common cause. sp500_return_pct
      proxies the global equity factor without containing the outcome.
      Bernanke and Kuttner (2005), Journal of Finance 60(3), on the
      equity market's response to monetary policy surprises - the same
      global equity factor this control proxies for bank_equity_return.
  quarter_end_dummy:
    owner: exogenous
    role: control
    parent_of: [cra_volume_growth, cra_oi_growth, corra_target_spread]
    backdoor_blocked: "spread <- dealer_balance_sheet_capacity -> positioning"
    rationale: >
      Proxies dealer balance-sheet capacity at reporting dates. Munyan (2015),
      OFR Working Paper 2015-22, on regulatory arbitrage in repo. Anbil and
      Senyuz (2018), FEDS, on window dressing. ECB Working Paper 2771 finds
      euro-area banks cut balance-sheet repo volumes by about 12.5% before
      quarter-ends and up to 25% before year-ends. On corra_target_spread
      specifically: quarter-end balance-sheet pressure plausibly pushes CORRA
      away from target the same way it pushes the CRA positioning metrics -
      the child relationship this control was declared for since before
      2026-09-16.
    note: >
      corra_target_spread removed from parent_of 2026-09-16, then RESTORED
      2026-09-20: the removal followed the old (wrong) reading that a
      control covering only the child was unjustified. It is a precision
      covariate for the central_banks L2 edge (goc_10y -> corra_target_spread)
      - it has no claimed path to goc_10y, so it cannot open a backdoor there
      either way; what it does is absorb residual variance in the child.
      Removing it took that edge from p=0.0002 to null. See adjustment_set's
      docstring in causal_estimates.py. cra_oi_growth was already in this
      list even though hedge_funds L2 (its only edge) does not declare
      quarter_end_dummy in its controls - that edge now controls on
      cra_roll_dummy instead, added below. NOT fixed here, flagged only.
  cra_roll_dummy:
    owner: exogenous
    role: control
    parent_of: [cra_oi_growth]
    backdoor_blocked: "cra_oi_growth <- contract_roll_mechanics -> surprise_timing"
    rationale: >
      Added 2026-09-16 at hedge_funds L2. Open interest resets mechanically
      as positions migrate from the expiring CRA contract to the new one each
      IMM quarter (m-x.ca/en/markets/interest-rate-derivatives/cra), a
      calendar effect unrelated to any policy surprise. Without it, a
      surprise landing inside the roll window would have that mechanical
      reset folded into the estimated positioning response.
  cra_policy_surprise:
    owner: exogenous
    role: treatment_and_potential_confounder
    parent_of: [goc_2y, goc_5y, goc_10y]
    status: TESTED_ON_ONE_EDGE
    rationale: >
      The treatment is an ancestor of every node. If it also has a DIRECT edge
      to any layer-3 outcome, then for edges below layer 1 the path child <-
      surprise -> outcome is an open backdoor and current estimates are
      biased. Test with: python src/diagnostics.py direct_path_test --parent
      effective_household_rate --child mortgage_funds_advanced_growth
    finding: >
      Conditioning on the surprise moved households L3 from -0.742 to -0.975,
      131% of the unconditioned value. An open backdoor would inflate the
      estimate and conditioning would shrink it; the opposite happened, so the
      treatment was masking part of the effect rather than contaminating it.
      Tested on that edge only.

# ===========================================================================
excluded:
  - node: monthly_credit_stocks
    applies_to: [resi_mortgage_credit_growth, nfc_credit_growth, personal_term_deposits, boc_goc_holdings, bond_fund_aum, bank_credit_growth]
    reason: >
      Two tested, both null. The arithmetic:

        household originations (FLOW):  outcome SD 19.47pp  -> b -0.742, p<0.0001
        NFC credit stock     (STOCK):  outcome SD  0.45pp  -> no horizon significant
        household mortgage credit (STOCK): outcome SD 0.079pp -> no horizon significant

      Regressor SD is ~11-12bp in all three cases. The outcome varies 40x
      less for a stock than for a flow. A large credit aggregate grows at
      0.4-0.6% per month with almost no variance; a rate shock cannot move it
      detectably with ~38 monthly observations. This is a property of the
      variable class, not of any particular series, so no better stock series
      fixes it.

      The NFC case does not fit this diagnosis. nfc_credit_flow carries far
      more variance than nfc_credit_growth and returns the same null: one
      marginal horizon of thirteen, alternating signs. Variance was not the
      binding constraint. There is no detectable rate to NFC credit
      relationship at monthly frequency in this sample at either scaling,
      most plausibly because corporate credit adjusts over quarters and 38
      monthly observations cannot span that.

  - node: quarterly_terminals
    applies_to: [household_debt_service_ratio, boc_net_income, statcan_real_estate_lending]
    reason: >
      ~13 observations in the primary window. Below any threshold for a local
      projection with controls.

  - node: bank_prime_rate
    reason: >
      Resets one-for-one with the target the business day after announcements.
      An accounting identity, not an edge with estimable variation.

  - node: us_effective_fed_funds_level
    reason: >
      Constant within a one-day window; cannot confound layer 1. Downstream,
      us_2y is the better proxy.

  - node: housing_activity
    reason: >
      A mediator on the rate -> originations edge, not a confounder.
      Conditioning would block the path being estimated.

  - node: bank_funding_spread
    reason: >
      Constructed spread gic_1y - tbill_1y. Rejected on two independent
      grounds. First, the behavioural leg is null: gic_1y regressed on goc_2y
      gives -0.073 (p=0.85) full sample and +0.248 (p=0.19) from 2023-09, so
      the deposit rate does not measurably respond. Second, the full-sample
      coefficient -0.933 (p=0.018) is carried by three implausible moves in
      gic_1y in mid-2023 (+142bp, -120bp, +185bp in consecutive prints);
      excluding them gives -0.579. The decomposition closes exactly:
      gic_1y -0.066 minus tbill_1y 0.867 equals the spread's -0.933, so 93%
      of the coefficient is the T-bill leg. This is a node-definition
      artifact - a spread between a market rate and a stale administered rate
      measures the definition, not a bank funding decision. Distinct from
      bank_prime_rate, which is an exact identity.
      NOTE the same structure applies to lending_deposit_spread; treat as
      suspect before estimating.

  - node: gic_5y
    status: downgraded_not_excluded
    reason: >
      beta 0.551 (p=0.047) full sample, 0.515 (p=0.16) from 2023-09. The
      point estimate is stable and consistent with household 0.576 and NFC
      0.596, but it is not significant on the clean sample. Report as
      consistent with the 0.55-0.60 pass-through pattern, not as an
      identified edge.

  - node: households_layer4
    status: capped_at_3_edges
    applies_to: [consumer_insolvencies_growth, consumer_proposal_share, consumer_proposals_growth, consumer_bankruptcies_growth]
    reason: >
      2026-09-19: households now stops at layer 3 (3 edges). The prior
      selection, consumer_insolvencies_growth at beta -0.296, is WITHDRAWN:
      it came from a specification that double-differenced an already-
      differenced parent (mortgage_funds_advanced_growth is itself a
      pct_change, so diff_x should have been false there as it is on every
      other layer-4 edge in this file - it was not).

      Three replacement candidates were screened against
      mortgage_funds_advanced_growth with controls [us_2y,
      unemployment_rate_ca] and all three fail:

        consumer_proposal_share:      ratio 0.052 (fails the variance
          screen outright). beta -2.932 at h=12, n=22 against 15 parameters
          (const + dx + 11 month dummies + 2 controls). Significant horizons
          alternate sign with no build-up: +1.48 (h1), -2.25 (h8), -1.78
          (h9), +0.68 (h10), -1.40 (h11), -2.93 (h12).

        consumer_proposals_growth:    ratio 0.567 (passes). beta -0.119,
          p 0.0038, also at h=12, n=22 against the same 15 parameters - a
          worse sample-to-parameter ratio than the estimate just withdrawn.

        consumer_bankruptcies_growth: ratio 0.621 (passes). beta +0.196 at
          h=2, n=32 - a healthier sample - but the sign is wrong: positive
          says more origination growth predicts more bankruptcy growth,
          opposite the chain's mechanism (weaker originations -> more
          distress).

      No candidate clears both a defensible horizon and the mechanism's
      sign, so the layer is dropped rather than forced onto the least-bad
      of three failures.

  - node: bond_index_return_pct
    status: removed_as_layer
    reason: >
      2026-09-19: removed as asset_managers layer 2. It is a bond-math
      identity, not an estimated effect: regressed on goc_10y it gives
      R2 0.914 with an SE 1/80th the coefficient (-0.0642, se 0.0008,
      n=850), and that beta implies a modified duration of 6.4 years against
      ZAG's actual ~7 - the gap explained by the 1bp tick rounding in goc_10y
      already documented in the node's own diff_y_note. A coefficient that
      close to a known physical constant, at that precision, is arithmetic
      the yield and the fund's duration make true by construction, not a
      relationship two edges of the chain independently confirm.

      shares_construction() cannot catch this: it walks each derived node's
      `inputs` list, and bond_index_return_pct and goc_10y are independently
      sourced series (one from yfinance, one from Valet) with no construction
      edge between them at all - the identity lives in bond duration math,
      not in either node's `inputs`. Recorded here as a screen limitation:
      shares_construction only detects a shared construction path, not a
      shared physical relationship between two unrelated sources.

      The chain now runs goc_10y -> bond_etf_volume_growth ->
      zag_xic_return_spread directly. bond_index_return_pct remains a valid,
      verified series_map node - zag_xic_return_spread is still built from
      it - it is just no longer estimated as its own layer.

  - node: tbill_coverage
    status: removed_as_layer
    reason: >
      2026-09-19: removed as central_governments layer 3, along with
      tbill_coverage_growth. Neither estimated nor composed: null in both
      level (+0.00211, p=0.267, n=80) and growth (+0.0170, p=0.889, n=79)
      form, wrong sign against the stated mechanism in both, and index-kind
      by UNIT_KIND (a dimensionless bid-to-cover ratio), which trips
      chain_all's unit-composition guard - the chain crossed a unit-kind
      boundary it could not cancel across the guard's edge-by-edge check,
      leaving status units_do_not_compose for four nodes that produced no
      chain effect regardless of what tbill_outstanding_growth estimated
      beneath it.

      tbill_outstanding_growth is re-pointed directly onto tbill_3m as the
      new layer 3. That edge is a direct cost-to-issuance link (see its
      mechanism, recorded before estimation), not a discovery arrived at by
      trying arrangements until one worked - and it is not to be
      rearranged again if it comes back null.