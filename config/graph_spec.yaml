      selected: goc_2y
      owner: central_governments
      estimate: {beta: 1.386, se: 0.176, r2: 0.613, n: 27}
      estimator: event_study
      controls: []
      mechanism: The 2Y is the marginal wholesale funding tenor.

    - layer: 2
      selected: gic_1y
      owner: banks
      estimator: distributed_lag
      controls: [us_2y]
      candidates:
        - {node: gic_1y, status: selected, owner: banks,
           evidence: "The raw funding rate. V80691339, weekly Wednesday, verified. Selected over the spread so layer 2 is a rate and layer 3 is the margin built on it, which keeps the chain in one unit kind. Carries the mid-2023 data_warning in series_map"}
        - {node: bank_funding_spread, status: rejected, owner: banks,
           evidence: "Derived gic_1y - tbill_1y. SPREAD. WARNING weekly Wednesday vs daily - overlap is Wednesdays only, untested. DISPLACED: it composes as a rate, but it nets out the funding-rate level this chain is trying to trace, and lending_deposit_spread at layer 3 is already the margin"}
        - {node: effective_business_rate, status: untested, owner: banks,
           evidence: "Already estimated for NFCs at 0.596. Reusable as the asset-side rate"}
      mechanism: >
        The gap between what banks pay for term retail money and the
        risk-free curve widens when funding demand rises with the path.

    - layer: 3
      selected: lending_deposit_spread
      owner: banks
      estimator: distributed_lag
      controls: [us_2y]
      candidates:
        - {node: lending_deposit_spread, status: selected, owner: banks,
           evidence: "Derived effective_household_rate - gic_1y. SPREAD - the realized margin itself rather than its capitalisation. Friday-stamped against a Wednesday parent; distributed_lag reindexes the parent onto the child's index. Same edge shape as general_banking layer 3"}
        - {node: bank_equity_return, status: untested, owner: banks,
           evidence: "Derived percent change of bank_equity_index (XFN.TO, auto_adjust total return), daily. RETURN, so it moves. MOVED to layer 4: it is the capitalisation of the margin, which makes it one step below the margin rather than an alternative to it"}
        - {node: bank_credit_growth, status: rejected, evidence: "STOCK"}
      mechanism: >
        Asset yields reprice faster than administered deposit rates, so the
        realized retail margin moves before competition closes the gap.

    - layer: 4
      selected: bank_equity_return
      owner: banks
      estimator: local_projection
      max_horizon: 12
      month_dummies: false
      controls: [sp500_return_pct]
      resample_child: W-FRI
      diff_controls: false
      candidates:
        - {node: bank_equity_return, status: selected, owner: banks,
           evidence: "Derived percent change of bank_equity_index (XFN.TO, auto_adjust total return), daily. RETURN, so it moves. Child resampled to W-FRI to sit on the Friday grid of the layer-3 parent: left daily against a weekly parent the join kept 4 dates and the HAC estimator collapsed at negative degrees of freedom"}
      mechanism: >
        Expected margin expansion capitalises into bank equity.
      controls_rationale: >
        tsx_return replaced 2026-09-16 with sp500_return_pct: the TSX
        Composite holds Canadian banks at roughly 20% weight, so it is partly
        a descendant of bank_equity_return rather than a clean common cause.
        sp500_return_pct proxies the global equity factor without containing
        the outcome. Resampled to the same weekly grid as the child and
        entered in levels because it is already a return, same treatment as
        the control it replaces.

