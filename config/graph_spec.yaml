asset_managers:
  label: Asset managers
  chain: bond_fund_flows
  confidence: medium
  note: >
    3 LAYERS POPULATED 2026-09-19: bond_index_return_pct removed as layer 2.
    New chain goc_10y -> bond_etf_volume_growth -> zag_xic_return_spread. See
    excluded > bond_index_return_pct.

    Only layer 1 composes into a chain product: chains.csv reports n_edges=1,
    status broken_link (layer 2 not significant controlled). The layer-3
    edge (bond_etf_volume_growth -> zag_xic_return_spread) does estimate,
    but sits past the layer-2 gap and is excluded from the product - see
    results/tables/chains.csv and edges.csv.
  layers:

    - layer: 1
      selected: goc_10y
      owner: central_governments
      estimate: {beta: 0.815, se: 0.234, r2: 0.319, n: 27}
      estimator: event_study
      controls: []
      mechanism: Duration exposure concentrates at the long end.

    - layer: 2
      selected: bond_etf_volume_growth
      owner: asset_managers
      estimator: local_projection
      max_horizon: 12
      month_dummies: false
      diff_x: false
      diff_controls: false
      diff_x_note: >
        The parent is already a pct_change, so it is not differenced again.
        With diff_x true it entered as a change in a growth rate, while the
        layer above produced a level of that growth rate - the chain then
        multiplied a level by a per-change coefficient.
      controls: [us_2y]
      controls_rationale: >
        MOVED TO LAYER 2 2026-09-19, direct child of goc_10y: us_2y matches
        this project's standard layer-2 control for every other sector whose
        parent is a bare GoC yield (households, general_banking,
        central_governments, nfcs, banks all control on us_2y there), and
        us_2y's exogenous_nodes.parent_of already covers goc_10y. Dropped
        equity_return_pct and vix, both carried over from the old layer 3:
        equity_return_pct's stated backdoor ("flows <- risk_appetite ->
        bond_returns") specifically named bond_returns, the now-removed
        intermediate node - it does not describe a fork on the direct
        goc_10y edge, and re-deriving a fresh backdoor story for it was not
        asked for here. vix stays on the surviving layer 3 edge below, where
        its rationale is unchanged.
      candidates:
        - {node: bond_etf_volume_growth, status: selected, evidence: "Status restored from candidate_screen.csv"}
        - {node: bond_fund_net_flows, status: unsourced, owner: asset_managers, evidence: "IFIC monthly net sales. FLOW. May not be free. Status restored from candidate_screen.csv"}
        - {node: bond_fund_aum, status: rejected, owner: asset_managers, evidence: "STOCK. Same failure mode as the credit aggregates. Status restored from candidate_screen.csv"}
        - {node: etf_creation_redemption, status: untested, owner: asset_managers, evidence: "FLOW, from ETF shares outstanding. Derivable from public data if IFIC is paywalled. Status restored from candidate_screen.csv"}
      restored: >
        RESTORED 2026-09-14 from results/tables: selection, estimator,
        settings and candidate statuses. Mechanism restored the same day from
        the session record.
      mechanism: >
        Yields move; managers rebalance in response and turnover rises.
        Formerly three edges via the intermediate bond-return node
        (bond_index_return_pct); collapsed to two because that intermediate
        was a bond-math identity, not an estimated effect - see excluded >
        bond_index_return_pct.

    - layer: 3
      selected: zag_xic_return_spread
      owner: asset_managers
      estimator: local_projection
      max_horizon: 12
      month_dummies: false
      diff_x: false
      controls: [vix]
      controls_rationale: >
        vix added 2026-09-16: Goldstein, Jiang and Ng (2017), JFE 126(3) -
        outflow sensitivity to poor performance rises with market
        illiquidity, making illiquidity a common cause of both flows (this
        chain's L2) and the return spread here. Unchanged by the 2026-09-19
        restructuring: this is the same parent-child pair as before, only its
        layer number moved from 4 to 3.
      candidates:
        - {node: zag_xic_return_spread, status: selected, evidence: "Status restored from candidate_screen.csv"}
        - {node: bond_etf_volume_growth, status: selected, evidence: "Status restored from candidate_screen.csv"}
        - {node: bond_fund_aum, status: rejected, owner: asset_managers, evidence: "STOCK. Same failure mode as the credit aggregates. Status restored from candidate_screen.csv"}
        - {node: bond_etf_flow_rate, status: rejected, owner: asset_managers,
           evidence: "IFIC industry bond ETF flow rate, divide(consumer sales, assets). RE-FILED 2026-09-20 from layer 2 to layer 3: it was always meant to sit beneath bond_etf_volume_growth, but the 2026-09-19 restructuring that moved bond_etf_volume_growth from layer 3 to layer 2 left this candidate behind at layer 2, screened against goc_10y instead. Screened at ratio 0.059 against bond_etf_volume_growth as parent - below the 0.5 pass threshold. Industry-wide proxy for a fund-specific quantity; see its series_map note"}
      restored: >
        RESTORED 2026-09-14 from results/tables: selection, estimator,
        settings and candidate statuses. Mechanism, mechanism test and finding
        restored the same day from the session record.
      mechanism: >
        The rotation between bonds and equities shows up as a widening return
        spread.
      mechanism_test: >
        SURVIVES. Controlling for bond_index_return_pct - the node
        zag_xic_return_spread is built from, no longer a layer in this chain
        but still the relevant confound to test - keeps 102% of the
        coefficient at h=7: beta -0.00084 (p 0.0014) against -0.00086
        (p 0.0015). The B/A ratio sits between 0.92 and 1.14 at every horizon
        from h=1 to h=12, so the edge is not a fork through the removed bond-
        return node on this test. The third arm of the usual test - that
        removed node against the child directly - was NOT run, because it is
        the identity regression: zag_xic_return_spread is built from
        bond_index_return_pct.
      finding: >
        ACCEPTED BY THE RULE, WEAK ON THE EVIDENCE. Four reasons to hold it
        lightly:

        One significant horizon of thirteen, h=7, with no significant
        neighbour and signs alternating around it (h=6 +0.00008, h=8
        -0.00015). It clears a Bonferroni threshold across the thirteen
        (0.0014 < 0.0038), but an isolated seven-business-day lead with no
        build-up is not the shape a rotation mechanism predicts.

        It fails the variance screen at 0.007, and the edge is economically
        tiny: a 1 SD move in volume growth (68.7pp) implies 0.058pp on the
        spread seven days later.

        The mechanism test is weaker than 102% makes it look at h>0. The
        control is the bond return at t while the child is the spread at t+7,
        so a fork running through the return at t+7 is not blocked by
        conditioning on the return at t. At h=0, where the control is
        contemporaneous, the ratio falls to 0.23 - but A is not significant
        there either, so that is not evidence of collapse.

        diagnostics.py mechanism_test can now run arms A and B for this edge
        with --daily --no-diff-x --no-diff-controls and an empty --controls,
        but its arm C regresses the child on bond_index_return_pct, which
        here is the identity 1 - d(equity)/d(bond). Read only A and B from it.

