# --- IFIC bond ETF proxy for ZAG creations/redemptions ----------------------
# The task registered this pair as a single 'ific_bond_etf' node, but
# bond_etf_flow_rate's divide op needs its two columns as separate,
# independently-fetchable nodes (the pct_change/subtract ops all take named
# node inputs, not column names within one node) - so each column of
# ific_bond_etf_monthly.csv is registered under its own column name instead.
bond_etf_net_sales_millions:
  source: csv
  file: ific/ific_bond_etf_monthly.csv
  series: bond_etf_net_sales_millions
  date_column: month
  frequency: monthly
  role: input_to_derived
  units: millions
  status: verified

bond_etf_net_assets_billions:
  source: csv
  file: ific/ific_bond_etf_monthly.csv
  series: bond_etf_net_assets_billions
  date_column: month
  frequency: monthly
  role: input_to_derived
  units: billions
  status: verified

bond_etf_flow_rate:
  source: derived
  op: divide
  inputs: [bond_etf_net_sales_millions, bond_etf_net_assets_billions]
  lag_b: 1
  scale: 0.1
  derivation: >
    100 * bond_etf_net_sales_millions / bond_etf_net_assets_billions.shift(1)
    - net sales (millions) over the PRIOR month's net assets (billions),
    scaled by 0.1 so millions-over-billions reads as a percent.
  frequency: monthly
  role: layer3
  units: percent
  status: verified
  note: >
    Proxies ZAG creations/redemptions, which is not available free at daily
    frequency. Substitutes an industry-wide (IFIC/SIMA) aggregate for a
    fund-specific quantity, attenuating the fund-level response toward the
    industry mean. Additionally, 18 of 40 months were revised between their
    first and second publication (e.g. 2025-04: 104 -> 75), so classical
    measurement error in the numerator attenuates any estimated beta toward
    zero. Both biases point the same way: the estimate is a lower bound.

    The source CSV is missing a 2024-03 row entirely (40 of the 41 months
    from 2023-03 to 2026-07 are present). bond_etf_net_assets_billions is
    reindexed onto a complete monthly grid before lag_b is applied, so
    2024-04's denominator - which would otherwise silently reuse 2024-02's
    asset level - is NaN instead.
